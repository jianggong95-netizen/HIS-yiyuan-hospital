<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" role="img" aria-label="iHealthOne OS — Healthcare Middle Platform">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#04122E"/>
      <stop offset="45%" stop-color="#0B2A5B"/>
      <stop offset="100%" stop-color="#1B57CE"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#7FC4FF" stop-opacity="0.55"/>
      <stop offset="55%" stop-color="#3B8BF0" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#3B8BF0" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="mark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#4A93FF"/>
      <stop offset="100%" stop-color="#1450C8"/>
    </linearGradient>
    <linearGradient id="arc" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#6BE6C6"/>
      <stop offset="100%" stop-color="#1FA98C"/>
    </linearGradient>
  </defs>

  <rect width="1280" height="640" fill="url(#bg)"/>
  <circle cx="1035" cy="300" r="330" fill="url(#glow)"/>

  <g stroke="#FFFFFF" stroke-opacity="0.10" fill="none">
    <circle cx="1035" cy="300" r="130"/>
    <circle cx="1035" cy="300" r="200"/>
    <circle cx="1035" cy="300" r="270"/>
  </g>
  <g stroke="#FFFFFF" stroke-opacity="0.05" fill="none" stroke-dasharray="6 10">
    <path d="M0 640 L430 380"/>
    <path d="M1280 640 L900 400"/>
  </g>

  <!-- brand mark -->
  <g transform="translate(80,68)">
    <rect width="64" height="64" rx="16" fill="url(#mark)"/>
    <circle cx="32" cy="32" r="21" fill="none" stroke="#FFFFFF" stroke-opacity="0.25" stroke-width="1"/>
    <path d="M32 16 V48 M16 32 H48" stroke="#FFFFFF" stroke-width="7" stroke-linecap="round"/>
    <path d="M48 47 A21 21 0 0 1 16 47" fill="none" stroke="url(#arc)" stroke-width="4" stroke-linecap="round"/>
  </g>
  <text x="164" y="96" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="26" font-weight="600" fill="#FFFFFF" fill-opacity="0.92">iHealthOne</text>
  <text x="164" y="122" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" fill="#FFFFFF" fill-opacity="0.55" letter-spacing="1.4">坐标软件集团 · SINCE 2005</text>

  <!-- headline -->
  <text x="78" y="262" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="86" font-weight="700" fill="#FFFFFF" letter-spacing="-1">iHealthOne OS</text>
  <text x="80" y="316" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="32" fill="#CBDFFF" fill-opacity="0.95">医疗中台操作系统 · Healthcare Middle Platform</text>
  <text x="80" y="366" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="19" fill="#FFFFFF" fill-opacity="0.62">全院信息化一体化底座　EMPI · CDR · 集成平台 · EMR · 互联网医院 · DRG/DIP</text>

  <!-- stats -->
  <g font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif">
    <text x="80" y="472" font-size="40" font-weight="700" fill="#FFFFFF">5,000+</text>
    <text x="80" y="500" font-size="16" fill="#FFFFFF" fill-opacity="0.6" letter-spacing="0.6">医疗机构 / institutions</text>
    <text x="340" y="472" font-size="40" font-weight="700" fill="#FFFFFF">300+</text>
    <text x="340" y="500" font-size="16" fill="#FFFFFF" fill-opacity="0.6" letter-spacing="0.6">三级医院 / tertiary hospitals</text>
    <text x="660" y="472" font-size="40" font-weight="700" fill="#FFFFFF">120+</text>
    <text x="660" y="500" font-size="16" fill="#FFFFFF" fill-opacity="0.6" letter-spacing="0.6">业务微服务 / microservices</text>
  </g>

  <line x1="80" y1="540" x2="1200" y2="540" stroke="#FFFFFF" stroke-opacity="0.14"/>

  <text x="80" y="580" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="17" fill="#FFFFFF" fill-opacity="0.55">深圳市坐标软件集团有限公司　|　国家高新技术企业 · 双软企业</text>
  <text x="1200" y="580" text-anchor="end" font-family="'Segoe UI',sans-serif" font-size="19" font-weight="600" fill="#8FD0FF">www.cnhis.com</text>
</svg>
