# 反向代理示例（仅供参考，生产需按院内网安全规范调整）
#
# 注意：limit_req_zone 必须声明在 http {} 块中，此处为方便阅读放入本文件，
# 落地时请将下面这一行移到 nginx.conf 的 http 段内。
limit_req_zone $binary_remote_addr zone=his_api:10m rate=20r/s;

upstream his_gateway {
    server 127.0.0.1:8787;
    keepalive 32;
}

server {
    listen 80;
    server_name open.example-hospital.cn;
    # 生产环境强制 HTTPS
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name open.example-hospital.cn;

    ssl_certificate     /etc/nginx/ssl/his.crt;
    ssl_certificate_key /etc/nginx/ssl/his.key;
    ssl_protocols       TLSv1.2 TLSv1.3;

    client_max_body_size 20m;
    server_tokens off;

    # 安全响应头
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # 接口限流（zone 定义见文件顶部）
    location /api/ {
        limit_req zone=his_api burst=40 nodelay;
        proxy_pass http://his_gateway;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    location /health {
        proxy_pass http://his_gateway;
        access_log off;
    }

    location / {
        proxy_pass http://his_gateway;
        proxy_set_header Host $host;
    }
}
