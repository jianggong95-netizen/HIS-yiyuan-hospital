services:
  gateway:
    build:
      context: .
      dockerfile: Dockerfile
    image: ihealthone/mock-gateway:2.6.0-preview
    container_name: ih1-mock-gateway
    ports:
      - "8787:8787"
    environment:
      PORT: "8787"
      NODE_ENV: production
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:8787/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 3
    labels:
      org.opencontainers.image.title: "iHealthOne OS Mock Gateway"
      org.opencontainers.image.vendor: "Shenzhen Coordinate Software Group"
      org.opencontainers.image.url: "https://www.cnhis.com"
